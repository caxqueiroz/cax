# https://taskfile.dev
version: '3'

vars:
  DIST: dist
  BIN: dist/cax
  PKG: ./...
  CMD: ./cmd/cax
  COVERAGE_FILE: coverage.out
  COVERAGE_HTML: coverage.html
  # Version stamping. Default: `git describe --tags --always --dirty` so
  # local builds show something like "v0.1.0-3-gabc1234-dirty" (or "dev"
  # in repos with no tags). Release CI overrides by exporting VERSION to
  # the tag name (e.g. v0.1.0); see .github/workflows/release.yml.
  VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
  # Shared linker flags. -s -w strips debug symbols (smaller binary);
  # -X injects the tag into the Version var that backs /about and the
  # welcome card.
  LDFLAGS: '-s -w -X github.com/caxqueiroz/cax/internal/channel/cli.Version={{.VERSION}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  build:
    desc: Build the cax binary into ./dist/cax (current platform; stamps {{.VERSION}})
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} {{.CMD}}

  build:darwin-arm64:
    desc: Build for macOS Apple Silicon
    env:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/cax-darwin-arm64 {{.CMD}}

  build:darwin-amd64:
    desc: Build for macOS Intel
    env:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/cax-darwin-amd64 {{.CMD}}

  build:linux-amd64:
    desc: Build for Linux x86_64
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/cax-linux-amd64 {{.CMD}}

  build:linux-arm64:
    desc: Build for Linux ARM64 (servers / Raspberry Pi)
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/cax-linux-arm64 {{.CMD}}

  build:windows-amd64:
    desc: Build for Windows x86_64 (produces cax-windows-amd64.exe)
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/cax-windows-amd64.exe {{.CMD}}

  build:windows-arm64:
    desc: Build for Windows ARM64
    env:
      GOOS: windows
      GOARCH: arm64
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/cax-windows-arm64.exe {{.CMD}}

  build:all:
    desc: Cross-compile binaries for every supported platform into ./dist/
    cmds:
      - task: build:darwin-arm64
      - task: build:darwin-amd64
      - task: build:linux-amd64
      - task: build:linux-arm64
      - task: build:windows-amd64
      - task: build:windows-arm64
      - 'echo ""; echo "release artifacts:"; ls -lh {{.DIST}}/cax-*'

  run:
    desc: 'Run cax (pass args after --: task run -- --flag)'
    cmds:
      - go run {{.CMD}} {{.CLI_ARGS}}

  install:
    desc: Install cax into $GOBIN / $GOPATH/bin
    cmds:
      - go install {{.CMD}}

  sqlc:
    desc: Regenerate internal/memory/memorydb from sql/schema.sql + sql/queries
    cmds:
      - sqlc generate

  test:
    desc: Run all tests
    cmds:
      - go test -count=1 {{.PKG}}

  test:race:
    desc: Run all tests with the race detector
    cmds:
      - go test -count=1 -race {{.PKG}}

  test:cov:
    desc: Run tests with coverage and open the HTML report
    cmds:
      - go test -count=1 -coverprofile={{.COVERAGE_FILE}} {{.PKG}}
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
      - 'echo "coverage report: {{.COVERAGE_HTML}}"'

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run {{.PKG}}

  lint:fix:
    desc: Run golangci-lint with --fix
    cmds:
      - golangci-lint run --fix {{.PKG}}

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.PKG}}

  fmt:
    desc: Format Go sources (gofmt -s -w)
    cmds:
      - gofmt -s -w .

  fmt:check:
    desc: Fail if any Go source needs formatting
    cmds:
      - |
        diff="$(gofmt -s -l . 2>/dev/null)"
        if [ -n "$diff" ]; then
          echo "the following files need gofmt -s:"
          echo "$diff"
          exit 1
        fi
    silent: true

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod / go.sum are not tidy
    cmds:
      - |
        go mod tidy
        if ! git diff --quiet -- go.mod go.sum; then
          echo "go.mod / go.sum need 'task tidy'"
          git --no-pager diff -- go.mod go.sum
          exit 1
        fi
    silent: true

  verify:
    desc: CI-equivalent gate (fmt:check + vet + lint + tidy:check + test)
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: tidy:check
      - task: test

  clean:
    desc: Remove built binaries and coverage artifacts
    cmds:
      - rm -rf {{.DIST}}
      - rm -f {{.COVERAGE_FILE}} {{.COVERAGE_HTML}}
