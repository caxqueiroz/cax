# cax example configuration.
# Providers are tried in order; the first is primary, the rest are fallbacks.

persona: "A concise, helpful personal assistant."

providers:
  # Toggle providers with `enabled`. The first enabled entry is primary; the
  # rest are fallbacks in order. Disabled entries are skipped and don't need
  # complete fields, so it's safe to keep them as templates.
  - name: openai
    enabled: true
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY   # name of the env var holding the key, not the key itself
    max_tokens: 4096
  # Bedrock Claude via KrakenD AI Gateway (no-op passthrough).
  # Native Anthropic payload; the API key is sent in the x-api-key header.
  # Flip `enabled: true` and fill the fields to wire it as a fallback.
  - name: bedrock
    enabled: false
    model: us.anthropic.claude-opus-4-7
    base_url: https://krakend.internal/bedrock
    token_env: CAX_BEDROCK_API_KEY
    max_tokens: 4096
  # Second openai entry running a CHEAP model — used by utility roles
  # (summarizer / fact_extractor / subagent_default) via model_roles below.
  # `type` is required when the name doesn't match the provider implementation.
  # - name: openai-cheap
  #   type: openai
  #   enabled: true
  #   model: gpt-5-nano
  #   api_key_env: OPENAI_API_KEY
  #   max_tokens: 4096

embeddings:
  provider: openai
  model: text-embedding-3-small
  dim: 1536
  api_key_env: OPENAI_API_KEY
  # Bedrock embeddings alternative:
  # provider: bedrock
  # model: amazon.titan-embed-text-v2:0
  # dim: 1024
  # base_url: https://krakend.internal/bedrock
  # token_env: CAX_BEDROCK_API_KEY

memory:
  db_path: ~/.cax/memory.db
  token_budget: 8000
  recall_k: 5
  # Retrieval mode:
  #   snippets (default): legacy — embed raw turns, recall top-K snippets.
  #   facts: mem0-style — extractor runs each turn (cheap model) to derive
  #          atomic facts. PreGeneration injects facts instead of snippets.
  #   both:  extract facts AND recall snippets; inject both.
  mode: snippets
  # Which model role runs fact extraction. Defaults to "fact_extractor",
  # which falls back to "cheap". Pick a cheap model — extraction runs every
  # turn when mode != snippets.
  # fact_extractor_role: fact_extractor

# Map model roles to provider names. The agent (main turn loop) always uses
# the fallback chain. Utility roles default to "cheap" → "agent". To save
# tokens on summarization / fact extraction / sub-agents, configure a second
# provider entry with a cheap model and point the roles at it.
# model_roles:
#   cheap: openai-cheap
#   summarizer: openai-cheap
#   fact_extractor: openai-cheap
#   subagent_default: openai-cheap

tools:
  web_enabled: true
  files_enabled: true
  bash_enabled: true
  require_confirm: true
  # Filesystem scope for Bash/Write/Edit/Read/Glob/Grep. The FIRST entry is
  # the writable workspace; subsequent entries are read-only allowed paths.
  # Tilde and env vars are expanded. Default when unset: [$HOME].
  workspace_dirs:
    - ~
    # - /tmp
    # - /Users/cq/Dev/some-other-project

subagents:
  enabled: true
  dirs:
    - ~/.cax/agents
    - .cax/agents

# MCP servers (real connections via dive experimental/mcp).
# Each server uses stdio when `command` is set, HTTP when `url` is set.
mcp:
  servers: []
  # Example stdio server (filesystem MCP):
  # - name: fs
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
  # Example HTTP server:
  # - name: remote
  #   url: https://mcp.example.com/sse

# Skills (markdown-defined agent capabilities).
# Loaded from cfg.Dirs (defaults: ~/.cax/skills and .cax/skills) plus any
# plugin-contributed directories (Plan 7).
skills:
  enabled: true
  dirs:
    - ~/.cax/skills
    - .cax/skills

# Plugins (Claude Code-compatible bundles dropped into ~/.cax/plugins/<name>
# or .cax/plugins/<name>). Each plugin may contribute skills, agents, MCP
# servers, LSP servers, hooks, and slash commands. State (enable/disable) is
# tracked at ~/.cax/plugins.json. Manage with /plugin (list|install|enable|
# disable|remove).
plugins:
  enabled: true
  dirs:
    - ~/.cax/plugins
    - .cax/plugins

# User-level slash commands (Plan 11). cax scans each dir for *.md files
# with Claude-Code-style frontmatter (description, argument-hint) and merges
# them into the slash-command set alongside plugin-contributed commands.
commands:
  enabled: true
  dirs:
    - ~/.cax/commands
    - .cax/commands

# Language Server Protocol servers (Plan 8). cax spawns one stdio child per
# entry, performs the LSP initialize/initialized handshake, and exposes six
# generic tools the agent can route by file extension: lsp_definition,
# lsp_references, lsp_hover, lsp_document_symbols, lsp_workspace_symbols,
# lsp_diagnostics. Plugins may contribute additional servers via
# .claude-plugin/lsp.json; user entries win on name collisions.
lsp:
  enabled: true
  servers: []
  # Example — uncomment and adjust to enable Go support via gopls:
  # - name: gopls
  #   command: gopls
  #   args: []
  #   languages: [go]
  #   root_patterns: [go.mod]

schedules: []
