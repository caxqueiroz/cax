# czcli example configuration.
# Providers are tried in order; the first is primary, the rest are fallbacks.

persona: "A concise, helpful personal assistant."

providers:
  # Bedrock Claude via KrakenD AI Gateway (no-op passthrough).
  # Native Anthropic payload; the API key is sent in the x-api-key header.
  - name: bedrock
    model: us.anthropic.claude-opus-4-7
    base_url: https://krakend.internal/bedrock
    token_env: CZCLI_BEDROCK_API_KEY
    max_tokens: 4096
  # OpenAI fallback (dive built-in provider).
  - name: openai
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096

embeddings:
  provider: openai
  model: text-embedding-3-small
  dim: 1536
  api_key_env: OPENAI_API_KEY
  # Bedrock embeddings alternative:
  # provider: bedrock
  # model: amazon.titan-embed-text-v2:0
  # dim: 1024
  # base_url: https://krakend.internal/bedrock
  # token_env: CZCLI_BEDROCK_API_KEY

memory:
  db_path: ~/.czcli/memory.db
  token_budget: 8000
  recall_k: 5

tools:
  web_enabled: true
  files_enabled: true
  bash_enabled: true
  require_confirm: true

subagents:
  enabled: true
  dir: .dive/agents

# MCP servers (real connections via dive experimental/mcp).
# Each server uses stdio when `command` is set, HTTP when `url` is set.
mcp:
  servers: []
  # Example stdio server (filesystem MCP):
  # - name: fs
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
  # Example HTTP server:
  # - name: remote
  #   url: https://mcp.example.com/sse

# Skills (markdown-defined agent capabilities).
# Loaded from cfg.Dirs (defaults: .dive/skills and ~/.dive/skills) plus any
# plugin-contributed directories (Plan 7).
skills:
  enabled: true
  dirs:
    - .dive/skills
    - ~/.dive/skills

# Plugins (Claude Code-compatible bundles dropped into ~/.czcli/plugins/<name>
# or .czcli/plugins/<name>). Each plugin may contribute skills, agents, MCP
# servers, LSP servers, hooks, and slash commands. State (enable/disable) is
# tracked at ~/.czcli/plugins.json. Manage with /plugin (list|install|enable|
# disable|remove).
plugins:
  enabled: true
  dirs:
    - ~/.czcli/plugins
    - .czcli/plugins

# Language Server Protocol servers (Plan 8). czcli spawns one stdio child per
# entry, performs the LSP initialize/initialized handshake, and exposes six
# generic tools the agent can route by file extension: lsp_definition,
# lsp_references, lsp_hover, lsp_document_symbols, lsp_workspace_symbols,
# lsp_diagnostics. Plugins may contribute additional servers via
# .claude-plugin/lsp.json; user entries win on name collisions.
lsp:
  enabled: true
  servers: []
  # Example — uncomment and adjust to enable Go support via gopls:
  # - name: gopls
  #   command: gopls
  #   args: []
  #   languages: [go]
  #   root_patterns: [go.mod]

schedules: []
